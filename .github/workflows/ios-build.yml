name: MECare v0.1.0 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MECARE_VERSION: MECare_v0.1.0

jobs:
  build-ios-simulator:
    name: MECare_v0.1.0 Simulator Build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Validate project
        run: |
          set -euo pipefail
          test -f MECare.xcodeproj/project.pbxproj
          xcodebuild -project MECare.xcodeproj -list

      - name: Build MECare_v0.1.0 for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build_logs
          xcodebuild \
            -project MECare.xcodeproj \
            -scheme MECare \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build_logs/MECare_v0.1.0_Simulator_xcodebuild.log

      - name: Package simulator artifact
        if: success()
        run: |
          set -euo pipefail
          APP='DerivedData/Build/Products/Debug-iphonesimulator/MECare.app'
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" MECare_v0.1.0_Simulator.app.zip
          shasum -a 256 MECare_v0.1.0_Simulator.app.zip | tee MECare_v0.1.0_Simulator.sha256
          echo 'MECare_v0.1.0 SIMULATOR BUILD SUCCEEDED' | tee MECare_v0.1.0_Simulator_BUILD_SUCCESS.txt

      - name: Upload simulator build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MECare_v0.1.0_Simulator_Logs
          path: build_logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MECare_v0.1.0 simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MECare_v0.1.0_iOS_Simulator
          path: |
            MECare_v0.1.0_Simulator.app.zip
            MECare_v0.1.0_Simulator.sha256
            MECare_v0.1.0_Simulator_BUILD_SUCCESS.txt
          if-no-files-found: error
          retention-days: 7

  build-ios-device-unsigned:
    name: MECare_v0.1.0 iPhone Device Build - Unsigned
    needs: build-ios-simulator
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Build MECare_v0.1.0 for physical iPhone SDK without signing
        run: |
          set -o pipefail
          mkdir -p device_build_logs
          xcodebuild \
            -project MECare.xcodeproj \
            -scheme MECare \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee device_build_logs/MECare_v0.1.0_Device_xcodebuild.log

      - name: Validate unsigned device application
        run: |
          set -euo pipefail
          APP='DeviceDerivedData/Build/Products/Debug-iphoneos/MECare.app'
          test -d "$APP"
          test -f "$APP/MECare"
          file "$APP/MECare" | tee MECare_v0.1.0_Device_Binary.txt
          codesign -dv "$APP" > MECare_v0.1.0_Codesign_Inspection.txt 2>&1 || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP='DeviceDerivedData/Build/Products/Debug-iphoneos/MECare.app'
          rm -rf Payload MECare_v0.1.0_Unsigned.ipa
          mkdir -p Payload
          ditto "$APP" 'Payload/MECare.app'
          /usr/bin/zip -qry MECare_v0.1.0_Unsigned.ipa Payload
          shasum -a 256 MECare_v0.1.0_Unsigned.ipa | tee MECare_v0.1.0_Unsigned.sha256
          echo 'MECare_v0.1.0 UNSIGNED IPHONE DEVICE BUILD SUCCEEDED' | tee MECare_v0.1.0_DEVICE_BUILD_SUCCESS.txt
          ls -lh MECare_v0.1.0_Unsigned.ipa

      - name: Upload device build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MECare_v0.1.0_Device_Logs
          path: |
            device_build_logs/
            MECare_v0.1.0_Device_Binary.txt
            MECare_v0.1.0_Codesign_Inspection.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned MECare_v0.1.0 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MECare_v0.1.0_iPhone_Unsigned
          path: |
            MECare_v0.1.0_Unsigned.ipa
            MECare_v0.1.0_Unsigned.sha256
            MECare_v0.1.0_DEVICE_BUILD_SUCCESS.txt
          if-no-files-found: error
          retention-days: 7
