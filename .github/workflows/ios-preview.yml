name: MECare v0.5.0 Visual Preview

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  visual-preview:
    name: Run MECare_v0.5.0 on iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build simulator app
        run: |
          set -euo pipefail
          mkdir -p Preview Logs
          xcodebuild \
            -project MECare.xcodeproj \
            -scheme MECare \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee Logs/MECare_v0.5.0_Preview_xcodebuild.log

      - name: Select and boot iPhone Simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available | tee Logs/available_simulators.txt
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); candidates=[]; [candidates.extend([d for d in devices if "iPhone" in d.get("name","") and d.get("isAvailable",True)]) for _,devices in data.get("devices",{}).items()]; print(candidates[-1]["udid"] if candidates else "")')"
          if [ -z "$UDID" ]; then
            echo 'No available iPhone Simulator found.' >&2
            exit 1
          fi
          echo "$UDID" | tee Preview/simulator_udid.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '13:00' --batteryState charged --batteryLevel 100 || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install MECare
        run: |
          set -euo pipefail
          APP='DerivedData/Build/Products/Debug-iphonesimulator/MECare.app'
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant notifications com.engineermahmoudebid.mecare || true
          xcrun simctl get_app_container "$UDID" com.engineermahmoudebid.mecare app | tee Preview/app_container.txt

      - name: Launch, record and capture screenshots
        run: |
          set -euo pipefail
          BUNDLE_ID='com.engineermahmoudebid.mecare'
          rm -f Preview/MECare_v0.5.0_Launch.mp4
          xcrun simctl io "$UDID" recordVideo --codec=h264 Preview/MECare_v0.5.0_Launch.mp4 > Logs/video_recording.log 2>&1 &
          VIDEO_PID=$!
          sleep 1
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" | tee Logs/app_launch.txt
          sleep 1
          xcrun simctl io "$UDID" screenshot Preview/01_MECare_v0.5.0_Splash.png
          sleep 3
          xcrun simctl io "$UDID" screenshot Preview/02_MECare_v0.5.0_Home.png
          sleep 3
          kill -INT "$VIDEO_PID" || true
          wait "$VIDEO_PID" || true
          test -s Preview/01_MECare_v0.5.0_Splash.png
          test -s Preview/02_MECare_v0.5.0_Home.png
          test -s Preview/MECare_v0.5.0_Launch.mp4

      - name: Verify app remains running
        run: |
          set -euo pipefail
          xcrun simctl spawn "$UDID" launchctl print system | grep -F 'com.engineermahmoudebid.mecare' > Preview/runtime_check.txt || true
          xcrun simctl io "$UDID" screenshot Preview/03_MECare_v0.5.0_Running.png
          test -s Preview/03_MECare_v0.5.0_Running.png
          shasum -a 256 Preview/* | tee Preview/SHA256SUMS.txt
          echo 'MECare_v0.5.0 VISUAL SIMULATOR PREVIEW SUCCEEDED' | tee Preview/PREVIEW_SUCCESS.txt

      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MECare_v0.5.0_Visual_Preview
          path: |
            Preview/
            Logs/
          if-no-files-found: error
          retention-days: 7
